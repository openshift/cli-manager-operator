# Allow all egress and required ingress for the cli-manager operand pod.
#
# Egress is needed for:
# - DNS resolution via openshift-dns
# - Kubernetes API server communication (watch Plugin CRDs, update status, leader election)
# - Container registries (pull images containing plugin binaries: quay.io, docker.io, gcr.io, etc.)
#
# Ingress is needed for:
# - Prometheus metrics scraping on port 60000 (from monitoring namespaces)
# - Plugin downloads on port 9449 (from OpenShift router via Route)
# - Kubelet health/readiness probes (work despite source restriction
#   because kubelet runs in host network, which is typically exempt from NetworkPolicy
#   enforcement by CNI plugins like OVN-Kubernetes)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress-and-metrics-ingress-operand
  namespace: openshift-cli-manager-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  podSelector:
    matchLabels:
      app: openshift-cli-manager
  egress:
  - {}
  ingress:
  # Allow metrics scraping from monitoring namespaces
  - from:
    - namespaceSelector:
        matchLabels:
          openshift.io/cluster-monitoring: "true"
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    ports:
    - protocol: TCP
      port: 60000
  # Allow plugin downloads from OpenShift router (Route traffic)
  - from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
    ports:
    - protocol: TCP
      port: 9449
  policyTypes:
  - Ingress
  - Egress
