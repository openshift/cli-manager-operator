apiVersion: v1
kind: Pod
metadata:
  generateName: np-client-
  namespace: {{NAMESPACE}}
  labels:
    test: connectivity
spec:
  restartPolicy: Never
  tolerations:
  - operator: Exists
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: connect
    image: registry.k8s.io/e2e-test-images/agnhost:2.45
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      runAsUser: 1001
    command:
    - /agnhost
    args:
    - connect
    - --protocol=tcp
    - --timeout=5s
    - {{TARGET}}
