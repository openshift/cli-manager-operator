apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-cli-manager-operator
  namespace: openshift-cli-manager-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      name: openshift-cli-manager-operator
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        name: openshift-cli-manager-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openshift-cli-manager-operator
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          image: quay.io/openshift/origin-cli-manager-operator:latest
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - name: tmp
              mountPath: "/tmp"
            - name: serving-cert
              mountPath: /var/run/secrets/serving-cert
              readOnly: true
          ports:
            - containerPort: 8443
              name: https
          livenessProbe:
            httpGet:
              scheme: HTTPS
              port: 8443
              path: /healthz
            initialDelaySeconds: 45
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              port: 8443
              path: /healthz
            initialDelaySeconds: 10
            timeoutSeconds: 10
          command:
            - cli-manager-operator
          args:
            - "operator"
          imagePullPolicy: Always
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAME
              value: "openshift-cli-manager-operator"
            - name: RELATED_IMAGE_OPERAND_IMAGE
              value: quay.io/openshift/origin-cli-manager:latest
      serviceAccountName: openshift-cli-manager-operator
      volumes:
        - name: tmp
          emptyDir: {}
        - name: serving-cert
          secret:
            secretName: cli-manager-operator-serving-cert
            optional: true
